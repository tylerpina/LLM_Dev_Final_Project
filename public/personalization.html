<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalization Demo - AI News Assistant</title>
    <style>
        :root {
            --bg-primary: #1e1e1e;
            --bg-secondary: #252526;
            --bg-tertiary: #2d2d30;
            --text-primary: #cccccc;
            --text-secondary: #9ca3af;
            --accent-blue: #007acc;
            --accent-green: #4ec9b0;
            --accent-purple: #c586c0;
            --border-color: #3e3e42;
            --success: #4ade80;
            --error: #f87171;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--accent-green);
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-secondary);
        }

        .user-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent-blue);
            font-weight: 500;
        }

        .input-group input,
        .input-group select,
        .input-group textarea {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
        }

        .btn-success {
            background: var(--success);
        }

        .results-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .results-section h2 {
            color: var(--accent-purple);
            margin-bottom: 16px;
            font-size: 18px;
        }

        .result-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .result-item h3 {
            color: var(--accent-green);
            margin-bottom: 8px;
            font-size: 16px;
        }

        .result-item .score {
            display: inline-block;
            background: var(--accent-blue);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .result-item .content {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.5;
        }

        .result-item .metadata {
            color: var(--text-secondary);
            font-size: 12px;
            margin-top: 8px;
            font-style: italic;
        }

        .profile-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
        }

        .profile-card .stat {
            margin-bottom: 12px;
        }

        .profile-card .stat-label {
            color: var(--accent-blue);
            font-weight: 500;
        }

        .profile-card .stat-value {
            color: var(--text-primary);
            margin-left: 8px;
        }

        .interests-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .interest-tag {
            background: var(--accent-purple);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }

        .error {
            background: var(--error);
            color: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .success {
            background: var(--success);
            color: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Personalization Demo</h1>
            <p>Test the AI-powered personalization system with vector embeddings and semantic search</p>
        </div>

        <div class="user-section">
            <div class="input-group">
                <label>User ID</label>
                <input type="text" id="userId" value="demo-user-123" placeholder="Enter user ID">
            </div>
        </div>

        <div class="grid">
            <div class="results-section">
                <h2>📝 Index Article</h2>
                <div class="input-group">
                    <label>Article ID</label>
                    <input type="text" id="articleId" placeholder="unique-article-id">
                </div>
                <div class="input-group">
                    <label>Title</label>
                    <input type="text" id="articleTitle" placeholder="Article title">
                </div>
                <div class="input-group">
                    <label>Content</label>
                    <textarea id="articleContent" placeholder="Article content..."></textarea>
                </div>
                <div class="input-group">
                    <label>Category</label>
                    <input type="text" id="articleCategory" placeholder="Technology, Science, etc.">
                </div>
                <button onclick="indexArticle()">Index Article</button>
            </div>

            <div class="results-section">
                <h2>👤 Track Interaction</h2>
                <div class="input-group">
                    <label>Query or Action</label>
                    <input type="text" id="interactionQuery" placeholder="machine learning, AI, etc.">
                </div>
                <div class="input-group">
                    <label>Interaction Type</label>
                    <select id="interactionType">
                        <option value="query">Query</option>
                        <option value="click">Click</option>
                        <option value="view">View</option>
                        <option value="like">Like</option>
                    </select>
                </div>
                <button onclick="trackInteraction()">Track Interaction</button>
            </div>
        </div>

        <div class="grid">
            <div class="results-section">
                <h2>🎯 Get Recommendations</h2>
                <div class="input-group">
                    <label>Limit</label>
                    <input type="number" id="recommendLimit" value="5" min="1" max="20">
                </div>
                <button onclick="getRecommendations()">Get Recommendations</button>
                <div id="recommendationsResults"></div>
            </div>

            <div class="results-section">
                <h2>🔍 Semantic Search</h2>
                <div class="input-group">
                    <label>Search Query</label>
                    <input type="text" id="searchQuery" placeholder="artificial intelligence breakthroughs">
                </div>
                <div class="input-group">
                    <label>Limit</label>
                    <input type="number" id="searchLimit" value="5" min="1" max="20">
                </div>
                <button onclick="semanticSearch()">Search</button>
                <div id="searchResults"></div>
            </div>
        </div>

        <div class="results-section">
            <h2>👤 User Profile</h2>
            <button onclick="getUserProfile()">Load Profile</button>
            <div id="profileResults"></div>
        </div>

        <div class="results-section">
            <h2>🎬 Quick Demo</h2>
            <p style="margin-bottom: 16px;">Run a complete demo with sample data</p>
            <button class="btn-success" onclick="runFullDemo()">Run Full Demo</button>
            <div id="demoLog"></div>
        </div>
    </div>

    <script>
        const BASE_URL = window.location.origin;

        function getUserId() {
            return document.getElementById('userId').value || 'demo-user-123';
        }

        function showMessage(elementId, message, type = 'success') {
            const el = document.getElementById(elementId);
            const div = document.createElement('div');
            div.className = type;
            div.textContent = message;
            el.innerHTML = '';
            el.appendChild(div);
        }

        function showLoading(elementId) {
            const el = document.getElementById(elementId);
            el.innerHTML = '<div class="loading">⏳ Loading...</div>';
        }

        async function indexArticle() {
            const articleId = document.getElementById('articleId').value;
            const title = document.getElementById('articleTitle').value;
            const content = document.getElementById('articleContent').value;
            const category = document.getElementById('articleCategory').value;

            if (!articleId || !title || !content) {
                alert('Please fill in all required fields');
                return;
            }

            try {
                const response = await fetch(`${BASE_URL}/personalize/index`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        articleId,
                        title,
                        content,
                        metadata: { category }
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    alert('✅ Article indexed successfully!');
                    // Clear form
                    document.getElementById('articleId').value = '';
                    document.getElementById('articleTitle').value = '';
                    document.getElementById('articleContent').value = '';
                    document.getElementById('articleCategory').value = '';
                } else {
                    alert('❌ Error: ' + data.error);
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        async function trackInteraction() {
            const query = document.getElementById('interactionQuery').value;
            const type = document.getElementById('interactionType').value;

            if (!query) {
                alert('Please enter a query or action');
                return;
            }

            try {
                const response = await fetch(`${BASE_URL}/personalize/track`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: getUserId(),
                        query,
                        interactionType: type
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    alert('✅ Interaction tracked!');
                    document.getElementById('interactionQuery').value = '';
                } else {
                    alert('❌ Error: ' + data.error);
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        async function getRecommendations() {
            const limit = document.getElementById('recommendLimit').value;
            const resultsDiv = 'recommendationsResults';
            
            showLoading(resultsDiv);

            try {
                const response = await fetch(
                    `${BASE_URL}/personalize/recommendations/${getUserId()}?limit=${limit}`
                );
                const data = await response.json();

                if (response.ok && data.recommendations) {
                    displayResults(resultsDiv, data.recommendations);
                } else {
                    showMessage(resultsDiv, data.error || 'No recommendations found', 'error');
                }
            } catch (error) {
                showMessage(resultsDiv, 'Error: ' + error.message, 'error');
            }
        }

        async function semanticSearch() {
            const query = document.getElementById('searchQuery').value;
            const limit = document.getElementById('searchLimit').value;
            const resultsDiv = 'searchResults';

            if (!query) {
                alert('Please enter a search query');
                return;
            }

            showLoading(resultsDiv);

            try {
                const response = await fetch(`${BASE_URL}/personalize/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query,
                        userId: getUserId(),
                        limit: parseInt(limit)
                    })
                });

                const data = await response.json();

                if (response.ok && data.results) {
                    displayResults(resultsDiv, data.results);
                } else {
                    showMessage(resultsDiv, data.error || 'No results found', 'error');
                }
            } catch (error) {
                showMessage(resultsDiv, 'Error: ' + error.message, 'error');
            }
        }

        async function getUserProfile() {
            const resultsDiv = 'profileResults';
            showLoading(resultsDiv);

            try {
                const response = await fetch(
                    `${BASE_URL}/personalize/profile/${getUserId()}`
                );
                const data = await response.json();

                if (response.ok) {
                    const profileHtml = `
                        <div class="profile-card">
                            <div class="stat">
                                <span class="stat-label">User ID:</span>
                                <span class="stat-value">${data.userId}</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Interactions:</span>
                                <span class="stat-value">${data.interactionCount}</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Created:</span>
                                <span class="stat-value">${new Date(data.createdAt).toLocaleString()}</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Last Active:</span>
                                <span class="stat-value">${new Date(data.lastActive).toLocaleString()}</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Interests:</span>
                                <div class="interests-tags">
                                    ${data.interests.map(i => `<span class="interest-tag">${i}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                    document.getElementById(resultsDiv).innerHTML = profileHtml;
                } else {
                    showMessage(resultsDiv, data.error || 'Profile not found', 'error');
                }
            } catch (error) {
                showMessage(resultsDiv, 'Error: ' + error.message, 'error');
            }
        }

        function displayResults(elementId, results) {
            const el = document.getElementById(elementId);
            
            if (!results || results.length === 0) {
                el.innerHTML = '<p style="color: var(--text-secondary);">No results found</p>';
                return;
            }

            const html = results.map(item => `
                <div class="result-item">
                    <h3>${item.title}</h3>
                    <div class="score">Relevance: ${(item.score * 100).toFixed(1)}%</div>
                    <div class="content">${item.content.substring(0, 200)}...</div>
                    ${item.metadata ? `<div class="metadata">Category: ${item.metadata.category || 'N/A'}</div>` : ''}
                </div>
            `).join('');

            el.innerHTML = html;
        }

        async function runFullDemo() {
            const logDiv = document.getElementById('demoLog');
            logDiv.innerHTML = '<div class="loading">Running demo...</div>';

            const sampleArticles = [
                {
                    id: 'demo-1',
                    title: 'Breakthrough in Quantum Computing',
                    content: 'Scientists achieve quantum supremacy with new processor architecture.',
                    category: 'Technology'
                },
                {
                    id: 'demo-2',
                    title: 'AI Transforms Medical Diagnosis',
                    content: 'Machine learning models detect diseases with unprecedented accuracy.',
                    category: 'Healthcare'
                },
                {
                    id: 'demo-3',
                    title: 'Neural Networks Advance NLP',
                    content: 'New transformer models revolutionize natural language understanding.',
                    category: 'AI'
                }
            ];

            try {
                // Index articles
                for (const article of sampleArticles) {
                    await fetch(`${BASE_URL}/personalize/index`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            articleId: article.id,
                            title: article.title,
                            content: article.content,
                            metadata: { category: article.category }
                        })
                    });
                }

                // Track interactions
                const interactions = [
                    'artificial intelligence',
                    'machine learning',
                    'neural networks'
                ];

                for (const query of interactions) {
                    await fetch(`${BASE_URL}/personalize/track`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            userId: getUserId(),
                            query,
                            interactionType: 'query'
                        })
                    });
                }

                logDiv.innerHTML = '<div class="success">✅ Demo completed! Try getting recommendations or viewing your profile.</div>';
            } catch (error) {
                logDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
